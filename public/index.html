<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LOCO Monkey Hunt</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap');
        
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family:'Inter',sans-serif;
            background:linear-gradient(135deg,#667eea,#764ba2);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }
        
        .app { width:100vw; height:100vh; }
        
        .screen {
            display:none;
            background:#fff;
            width:100%;
            height:100vh;
            padding:20px;
            overflow-y:auto;
        }
        
        .screen.active { display:flex; flex-direction:column; }
        
        #start { justify-content:center; }
        
        .logo-box {
            width:100px;
            height:100px;
            margin:0 auto 24px;
            background:#f1f5f9;
            border-radius:24px;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 8px 24px rgba(102,126,234,0.3);
        }
        
        .logo { width:80px; height:80px; object-fit:contain; }
        
        h1 {
            font-size:2.2rem;
            font-weight:900;
            text-align:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom:8px;
        }
        
        .tagline { text-align:center; color:#64748b; font-size:0.95rem; font-weight:600; margin-bottom:24px; }
        
        .cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
        
        .card {
            background:linear-gradient(135deg,#f8fafc,#f1f5f9);
            border-radius:18px;
            padding:24px 16px;
            text-align:center;
            border:2px solid rgba(102,126,234,0.1);
        }
        
        .icon { font-size:2rem; margin-bottom:12px; }
        .value { font-size:2.5rem; font-weight:900; color:#667eea; line-height:1; }
        .label { font-size:0.7rem; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.8px; margin-top:8px; }
        
            .player {
                background:linear-gradient(135deg,#667eea,#764ba2);
                border-radius:16px;
                padding:16px;
                display:flex;
                align-items:center;
            }
        </style>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
            </div>
            <div class="message">
                💰 Tokens will be sent to:
                <div class="wallet-display" id="winWallet"></div>
            </div>
        </div>

        <div id="lose" class="screen">
            <div class="badge fail">✕</div>
            <h2>TIME'S UP</h2>
            <p>The monkey escaped!</p>
            <div class="metrics single">
                <div class="metric"><div>🎯</div><div id="loseClicks">0</div><div>CLICKS</div></div>
            </div>
            <div class="message fail">Better luck next time! 🍀</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
